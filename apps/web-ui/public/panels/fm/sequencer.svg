  <g transform="translate(50.5,72)"><circle r="4.2" fill="url(#knobBody)" stroke="#0a0a0a" stroke-width=".3"/><circle r="2.5" fill="url(#knobCap)"/><line x1="0" y1="-2.1" x2="0" y2="-0.4" stroke="#e8c547" stroke-width=".75" stroke-linecap="round"/></g>

