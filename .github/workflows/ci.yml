name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege — CI only needs to read the repo (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # Pin to full commit SHAs (immutable) — not floating tags like @v4 / @stable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install system deps
        run: |
          sudo apt-get update
          # g++: emenay-mi-host C++ firmware hosts
          # libasound2-dev: midir → alsa-sys (pkg-config alsa)
          # ngspice: emenay-spice circuit checks
          sudo apt-get install -y g++ libasound2-dev pkg-config ngspice
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Test
        run: cargo test --workspace --exclude emenay-desktop
      - name: SPICE check
        run: cargo run -p emenay-spice --bin emenay-spice-check

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y g++
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json
      - run: npm ci
      - run: npm run check:faceplates
      - run: npm run build
