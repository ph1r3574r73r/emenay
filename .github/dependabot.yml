version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # See .cargo/audit.toml — blocked on Tauri GTK4 / glib >= 0.20.
      - dependency-name: glib
        versions: [">=0.15.0, <0.20.0"]

  - package-ecosystem: npm
    directory: "/apps/web-ui"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
